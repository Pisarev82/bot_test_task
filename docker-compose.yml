services:
  bot:
    build: .
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      WEBHOOK_URL: ${WEBHOOK_URL}  # Например: https://nails-tango.online/webhook
      WEB_SERVER_HOST: "0.0.0.0"   # Важно для работы внутри контейнера
      WEB_SERVER_PORT: "8777"
    networks:
      - app-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/letsencrypt
      - ./static:/var/www/html
    depends_on:
      - bot
    networks:
      - app-network
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certs:/etc/letsencrypt
      - ./static:/var/www/html
    command: >
      certonly --webroot
      --webroot-path=/var/www/html
      --email ${EMAIL}
      --agree-tos
      --no-eff-email
      --non-interactive
      --keep-until-expiring
      -d ${DOMAIN}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge